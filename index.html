<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>上下班打卡</title>
  <meta name="description" content="上下班打卡：本地记录上下班时间、月平均和剩余每日平均。数据只保存在这台设备上。">
  <meta name="theme-color" content="#16324f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <script>
    // Apply the remembered language before first paint to avoid a flash.
    try {
      var __lang = localStorage.getItem("clock-in-lang");
      if (__lang === "en") document.documentElement.lang = "en";
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="appTitle">上下班打卡</h1>
  </header>

  <main>
    <!-- Tab 1: punch only -->
    <section class="tab-view active" id="view-home" aria-label="punch">
      <div class="card punch-card">
        <div class="today-line"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span id="todayLabel"></span></div>
        <div class="live-clock" id="liveClock">--:--:--</div>
        <button id="punchBtn" class="punch-btn punch-in" type="button">
          <svg id="punchClock" class="punch-clock" viewBox="0 0 100 100" aria-hidden="true" hidden>
            <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
            <g id="clockTicks" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"></g>
            <line id="clockHourHand" x1="50" y1="50" x2="50" y2="26" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
            <line id="clockMinHand" x1="50" y1="50" x2="50" y2="16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
            <line id="clockSecHand" x1="50" y1="56" x2="50" y2="12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="2.5" fill="#fff"/>
          </svg>
          <span id="punchText" class="punch-text"></span>
        </button>
        <div class="ongoing-line" id="ongoingLine" hidden></div>
      </div>
      <div class="card today-record-card" id="todayRecordCard" hidden>
        <div class="day-head">
          <span class="day-date" id="todayRecordDate"></span>
          <span class="day-hours" id="todayRecordHours"></span>
        </div>
        <div class="day-times" id="todayRecordTimes"></div>
      </div>

      <div class="card stats-card">
        <div class="stat-row">
          <span class="stat-label icon-label"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20V10M18 20V4M6 20v-4"/></svg><span id="monthLabel"></span></span>
          <span class="big-number"><span id="monthAvgValue">0.0</span><span class="unit" id="monthAvgUnit"></span></span>
        </div>
        <div class="attended" id="attendedValue"></div>
      </div>

      <div class="card forecast-card" id="forecastCard">
        <div class="forecast-grid">
          <div class="forecast-main">
            <span class="stat-label icon-label"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span data-i18n="forecastLabel">接下来每日平均</span></span>
            <span class="big-number"><span id="forecastValue">—</span><span class="unit" id="forecastUnit"></span></span>
            <div class="completed-avg" id="completedAvgValue"></div>
          </div>
          <div class="remaining-box">
            <span class="stat-label icon-label"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span data-i18n="remainingDays">剩余上班天数</span></span>
            <div class="remaining-controls">
              <button id="remainingMinus" class="step-btn" type="button" aria-label="−">−</button>
              <button id="remainingValue" class="remaining-value" type="button">0</button>
              <input id="remainingInput" class="remaining-input" type="number" min="0" max="31" hidden>
              <button id="remainingPlus" class="step-btn" type="button" aria-label="+">+</button>
            </div>
            <div class="remaining-auto-note" id="remainingAutoNote"></div>
            <button id="restoreAutoBtn" class="restore-btn" type="button" data-i18n="restoreAuto" hidden>恢复自动</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 2: history & trend -->
    <section class="tab-view" id="view-history" aria-label="history">
      <div class="segmented" role="group" aria-label="范围">
        <button id="rangeWeek" class="seg-btn" type="button" data-i18n="rangeWeek">周</button>
        <button id="rangeMonth" class="seg-btn active" type="button" data-i18n="rangeMonth">月</button>
        <button id="rangeAll" class="seg-btn" type="button" data-i18n="rangeAll">全部</button>
      </div>

      <div class="card month-nav-card" id="monthNavCard">
        <button id="monthPrev" class="step-btn" type="button" aria-label="‹">‹</button>
        <span class="month-label-wrap">
          <button id="monthLabelBtn" class="month-label-btn" type="button"></button>
          <input id="monthPicker" type="month" aria-label="选择月份">
        </span>
        <button id="monthNext" class="step-btn" type="button" aria-label="›">›</button>
        <button id="backToCurrentBtn" class="mini-btn" type="button" data-i18n="backToCurrentMonth" hidden>回到本月</button>
      </div>

      <div class="card chart-card">
        <div class="section-head chart-head">
          <span class="icon-label"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg><h2 id="chartTitle"></h2></span>
          <span class="stat-label" data-i18n="hoursUnit">小时</span>
        </div>
        <div class="chart-wrap">
          <div class="chart-yaxis" aria-hidden="true"><span>12</span><span>8</span><span>4</span><span>0</span></div>
          <div class="chart-scroll" id="chartScroll">
            <div class="chart-bars" id="chartBars"></div>
          </div>
        </div>
        <div class="chart-detail" id="chartDetail"></div>
      </div>

      <div class="history-section">
        <div class="section-head">
          <span class="icon-label"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><h2 data-i18n="history">历史记录</h2></span>
          <button id="addDayBtn" class="mini-btn" type="button" data-i18n="addDay">补录一天</button>
        </div>
        <div id="historyList" style="margin-top: 8px;"></div>
      </div>
    </section>

    <!-- Tab 3: settings -->
    <section class="tab-view" id="view-settings" aria-label="settings">
      <div class="card backup-card">
        <div class="backup-actions">
          <button id="exportBtn" class="action-btn" type="button"><span class="btn-inner"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span data-i18n="exportBtn">导出备份</span></span></button>
          <button id="importBtn" class="action-btn secondary" type="button"><span class="btn-inner"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><span data-i18n="importBtn">导入备份</span></span></button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
        <p class="hint" data-i18n="exportHint">数据只保存在这台设备上，记得定期导出备份。</p>
      </div>

      <div class="card settings-card">
        <div class="settings-row">
          <span class="icon-label"><svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="stat-label" data-i18n="language">语言</span></span>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button id="langZh" class="active" type="button">中文</button>
            <button id="langEn" type="button">EN</button>
          </div>
        </div>
        <p class="hint" data-i18n="localOnlyNote">数据只保存在这台设备上，不会上传到任何服务器。建议定期导出备份。</p>
      </div>

      <footer class="foot">Clock-in PWA · v1.5.0</footer>
    </section>
  </main>

  <nav class="tabbar" aria-label="tabs">
    <button type="button" class="tab-btn active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="tabPunch">打卡</span>
    </button>
    <button type="button" class="tab-btn" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 20v-5"/><path d="M12 20V8"/><path d="M17 20v-8"/></svg>
      <span data-i18n="tabHistory">历史与趋势</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg>
      <span data-i18n="tabSettings">设置</span>
    </button>
  </nav>

  <dialog id="dayDialog">
    <form id="dialogForm" class="dialog-body">
      <h3 id="dialogTitle"></h3>
      <div class="field">
        <label for="fieldDate" data-i18n="date">日期</label>
        <input id="fieldDate" type="date" required>
      </div>
      <div class="field">
        <label for="fieldClockIn" data-i18n="clockIn">上班时间</label>
        <input id="fieldClockIn" type="time" required>
      </div>
      <div class="field">
        <label for="fieldClockOut" data-i18n="clockOut">下班时间</label>
        <input id="fieldClockOut" type="time">
      </div>
      <div class="field">
        <label for="fieldNote" data-i18n="note">备注</label>
        <input id="fieldNote" type="text" autocomplete="off">
      </div>
      <div class="dialog-actions">
        <button id="dialogSaveBtn" class="action-btn" type="submit" data-i18n="save">保存</button>
        <button id="dialogDeleteBtn" class="danger-btn" type="button" data-i18n="deleteBtn" hidden>删除</button>
        <button id="dialogCancelBtn" class="action-btn secondary" type="button" data-i18n="cancel">取消</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./src/js/ui.js"></script>
</body>
</html>
